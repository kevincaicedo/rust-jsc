name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt -- --check

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-check-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: rust-check-${{ runner.os }}-

      - name: Cargo check (macros)
        run: cargo check -p rust_jsc_macros

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-test-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: rust-test-${{ runner.os }}-

      - name: Check release availability
        id: check_release
        run: |
          VERSION=$(grep '^version' sys/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          URL="https://github.com/kevincaicedo/rust-jsc/releases/download/sys-v${VERSION}/libjsc-x86_64-unknown-linux-gnu.a.gz"
          MANIFEST_URL="https://github.com/kevincaicedo/rust-jsc/releases/download/sys-v${VERSION}/SHA256SUMS"
          if curl --output /dev/null --silent --head --fail "$URL" && \
             curl --output /dev/null --silent --head --fail "$MANIFEST_URL"; then
            echo "Release for $VERSION exists with checksum manifest. sys/build.rs will download it."
            echo "BUILD_STATIC=false" >> $GITHUB_ENV
          else
            echo "Release for $VERSION or SHA256SUMS not found. Will build static lib via Docker."
            echo "BUILD_STATIC=true" >> $GITHUB_ENV
          fi

      - name: Free disk space
        if: env.BUILD_STATIC == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h

      - name: Set up Docker Buildx
        if: env.BUILD_STATIC == 'true'
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Cache Docker layers
        if: env.BUILD_STATIC == 'true'
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-linux-x86_64
          key: buildx-linux-x86_64-${{ hashFiles('Dockerfile', 'Makefile', 'sys/Cargo.toml') }}
          restore-keys: buildx-linux-x86_64-

      - name: Build JavaScriptCore static
        if: env.BUILD_STATIC == 'true'
        run: |
          mkdir -p .libs
          docker buildx build \
            --output type=local,dest=.libs \
            --cache-from type=local,src=/tmp/.buildx-cache-linux-x86_64 \
            --cache-to type=local,dest=/tmp/.buildx-cache-linux-x86_64-new,mode=max \
            -f Dockerfile .
          test -f .libs/libJavaScriptCore.a
          test -f .libs/libWTF.a
          test -f .libs/libbmalloc.a
          test -f .libs/libstdc++.a
          test -f .libs/libicui18n.a
          test -f .libs/libicuuc.a
          test -f .libs/libicudata.a
          test -f .libs/libatomic.a
          if [ -f .libs/libJavaScriptCoreJIT.a ]; then
            echo "Found separate JavaScriptCoreJIT archive"
          else
            echo "No separate JavaScriptCoreJIT archive produced for this target"
          fi
          echo "RUST_JSC_BUILD_MODE=download" >> $GITHUB_ENV
          echo "RUST_JSC_LIB_DIR=${{ github.workspace }}/.libs" >> $GITHUB_ENV

      - name: Rotate cache
        if: always() && env.BUILD_STATIC == 'true'
        run: |
          rm -rf /tmp/.buildx-cache-linux-x86_64
          mv /tmp/.buildx-cache-linux-x86_64-new /tmp/.buildx-cache-linux-x86_64 2>/dev/null || true

      - name: Run tests
        env:
          RUST_JSC_BUILD_MODE: download
          RUST_BACKTRACE: 1
        run: cargo test --lib -- --test-threads=1
