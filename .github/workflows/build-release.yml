name: Build and Release JSC Static Libraries

on:
  push:
    branches: [main]
    tags:
      - "sys-v*"
    paths:
      - 'sys/**'
      - 'WebKit/**'
      - '.gitmodules'
      - 'Makefile'
      - 'Dockerfile'
      - 'Dockerfile.arm'
      - 'Dockerfile.musl'
      - '.github/workflows/build-release.yml'
  workflow_dispatch:
    inputs:
      skip_cache:
        description: "Skip Docker layer cache"
        required: false
        default: "false"
        type: boolean
      publish_release:
        description: "Create the sys-v<version> GitHub release from this run"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: javascriptcore

jobs:
  # ---------------------------------------------------------------------------
  # Prepare: extract version from sys/Cargo.toml
  # ---------------------------------------------------------------------------
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from sys/Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version' sys/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          RELEASE_TAG="sys-v${VERSION}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$RELEASE_TAG" ]; then
            echo "Error: tag ${GITHUB_REF_NAME} does not match sys package version ${RELEASE_TAG}"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Detected sys version: $VERSION"

  # ===========================================================================
  # macOS Builds
  # ===========================================================================

  build-macos-x86_64:
    name: macOS x86_64
    runs-on: macos-15-intel
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install cmake ninja

      - name: Build JavaScriptCore
        run: make build-jsc-static JSC_JOBS=8 JSC_EXTRA_CMAKE_ARGS="-DCMAKE_OSX_ARCHITECTURES=x86_64"

      - name: Archive static libraries
        run: make archive platform=x86_64-apple-darwin

      - name: Verify archive contents
        run: |
          tar -tzf libjsc-x86_64-apple-darwin.a.gz | tee archive-contents.txt
          grep -x 'libJavaScriptCore.a' archive-contents.txt >/dev/null
          grep -x 'libJavaScriptCoreJIT.a' archive-contents.txt >/dev/null
          grep -x 'libWTF.a' archive-contents.txt >/dev/null
          grep -x 'libbmalloc.a' archive-contents.txt >/dev/null

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libjsc-x86_64-apple-darwin
          if-no-files-found: error
          path: |
            libjsc-x86_64-apple-darwin.a.gz
            libjsc-x86_64-apple-darwin.a.gz.sha256
            libjsc-x86_64-apple-darwin.metadata.json
          retention-days: 7

  build-macos-aarch64:
    name: macOS aarch64
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install cmake ninja

      - name: Build JavaScriptCore
        run: make build-jsc-static JSC_JOBS=8 JSC_EXTRA_CMAKE_ARGS="-DCMAKE_OSX_ARCHITECTURES=arm64"

      - name: Archive static libraries
        run: make archive platform=aarch64-apple-darwin

      - name: Verify archive contents
        run: |
          tar -tzf libjsc-aarch64-apple-darwin.a.gz | tee archive-contents.txt
          grep -x 'libJavaScriptCore.a' archive-contents.txt >/dev/null
          grep -x 'libJavaScriptCoreJIT.a' archive-contents.txt >/dev/null
          grep -x 'libWTF.a' archive-contents.txt >/dev/null
          grep -x 'libbmalloc.a' archive-contents.txt >/dev/null

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libjsc-aarch64-apple-darwin
          if-no-files-found: error
          path: |
            libjsc-aarch64-apple-darwin.a.gz
            libjsc-aarch64-apple-darwin.a.gz.sha256
            libjsc-aarch64-apple-darwin.metadata.json
          retention-days: 7

  # ===========================================================================
  # Linux x86_64 Builds (Docker on x86_64 runners)
  # ===========================================================================

  build-linux-x86_64:
    name: Linux x86_64 (glibc)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune --all --force
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Cache Docker layers
        if: github.event.inputs.skip_cache != 'true'
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-linux-x86_64
          key: buildx-linux-x86_64-${{ hashFiles('Dockerfile', 'Makefile', 'sys/Cargo.toml') }}
          restore-keys: buildx-linux-x86_64-

      - name: Build JavaScriptCore
        run: |
          mkdir -p .libs
          CACHE_ARGS=()
          if [ "${{ github.event.inputs.skip_cache }}" != "true" ]; then
            CACHE_ARGS+=(--cache-from type=local,src=/tmp/.buildx-cache-linux-x86_64)
            CACHE_ARGS+=(--cache-to type=local,dest=/tmp/.buildx-cache-linux-x86_64-new,mode=max)
          fi
          docker buildx build \
            --output type=local,dest=./.libs \
            "${CACHE_ARGS[@]}" \
            -f Dockerfile .

      - name: Rotate cache
        if: always() && github.event.inputs.skip_cache != 'true'
        run: |
          rm -rf /tmp/.buildx-cache-linux-x86_64
          mv /tmp/.buildx-cache-linux-x86_64-new /tmp/.buildx-cache-linux-x86_64 2>/dev/null || true

      - name: Archive static libraries
        run: |
          python3 scripts/package_jsc_archive.py --lib-dir .libs --target-triple x86_64-unknown-linux-gnu --output-dir . --repo-root "$PWD" --webkit-dir WebKit

      - name: Verify archive contents
        run: |
          tar -tzf libjsc-x86_64-unknown-linux-gnu.a.gz | tee archive-contents.txt
          grep -x 'libJavaScriptCore.a' archive-contents.txt >/dev/null
          grep -x 'libWTF.a' archive-contents.txt >/dev/null
          grep -x 'libbmalloc.a' archive-contents.txt >/dev/null
          grep -x 'libstdc++.a' archive-contents.txt >/dev/null
          grep -x 'libicui18n.a' archive-contents.txt >/dev/null
          grep -x 'libicuuc.a' archive-contents.txt >/dev/null
          grep -x 'libicudata.a' archive-contents.txt >/dev/null
          grep -x 'libatomic.a' archive-contents.txt >/dev/null
          if grep -x 'libJavaScriptCoreJIT.a' archive-contents.txt >/dev/null; then
            echo "Found separate JavaScriptCoreJIT archive"
          else
            echo "No separate JavaScriptCoreJIT archive produced for this target"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libjsc-x86_64-unknown-linux-gnu
          if-no-files-found: error
          path: |
            libjsc-x86_64-unknown-linux-gnu.a.gz
            libjsc-x86_64-unknown-linux-gnu.a.gz.sha256
            libjsc-x86_64-unknown-linux-gnu.metadata.json
          retention-days: 7

  build-linux-x86_64-musl:
    name: Linux x86_64 (musl)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune --all --force
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Cache Docker layers
        if: github.event.inputs.skip_cache != 'true'
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-linux-musl-x86_64
          key: buildx-linux-musl-x86_64-${{ hashFiles('Dockerfile.musl', 'Makefile', 'sys/Cargo.toml') }}
          restore-keys: buildx-linux-musl-x86_64-

      - name: Build JavaScriptCore
        run: |
          mkdir -p .libs-musl
          CACHE_ARGS=()
          if [ "${{ github.event.inputs.skip_cache }}" != "true" ]; then
            CACHE_ARGS+=(--cache-from type=local,src=/tmp/.buildx-cache-linux-musl-x86_64)
            CACHE_ARGS+=(--cache-to type=local,dest=/tmp/.buildx-cache-linux-musl-x86_64-new,mode=max)
          fi
          docker buildx build \
            --output type=local,dest=./.libs-musl \
            "${CACHE_ARGS[@]}" \
            -f Dockerfile.musl .

      - name: Rotate cache
        if: always() && github.event.inputs.skip_cache != 'true'
        run: |
          rm -rf /tmp/.buildx-cache-linux-musl-x86_64
          mv /tmp/.buildx-cache-linux-musl-x86_64-new /tmp/.buildx-cache-linux-musl-x86_64 2>/dev/null || true

      - name: Archive static libraries
        run: |
          python3 scripts/package_jsc_archive.py --lib-dir .libs-musl --target-triple x86_64-unknown-linux-musl --output-dir . --repo-root "$PWD" --webkit-dir WebKit

      - name: Verify archive contents
        run: |
          tar -tzf libjsc-x86_64-unknown-linux-musl.a.gz | tee archive-contents.txt
          grep -x 'libJavaScriptCore.a' archive-contents.txt >/dev/null
          grep -x 'libWTF.a' archive-contents.txt >/dev/null
          grep -x 'libbmalloc.a' archive-contents.txt >/dev/null
          grep -x 'libstdc++.a' archive-contents.txt >/dev/null
          grep -x 'libicui18n.a' archive-contents.txt >/dev/null
          grep -x 'libicuuc.a' archive-contents.txt >/dev/null
          grep -x 'libicudata.a' archive-contents.txt >/dev/null
          grep -x 'libatomic.a' archive-contents.txt >/dev/null
          if grep -x 'libJavaScriptCoreJIT.a' archive-contents.txt >/dev/null; then
            echo "Found separate JavaScriptCoreJIT archive"
          else
            echo "No separate JavaScriptCoreJIT archive produced for this target"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libjsc-x86_64-unknown-linux-musl
          if-no-files-found: error
          path: |
            libjsc-x86_64-unknown-linux-musl.a.gz
            libjsc-x86_64-unknown-linux-musl.a.gz.sha256
            libjsc-x86_64-unknown-linux-musl.metadata.json
          retention-days: 7

  # ===========================================================================
  # Linux aarch64 Builds (Docker on native ARM64 runners — no QEMU)
  # ===========================================================================

  build-linux-aarch64:
    name: Linux aarch64 (glibc)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune --all --force
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Cache Docker layers
        if: github.event.inputs.skip_cache != 'true'
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-linux-aarch64
          key: buildx-linux-aarch64-${{ hashFiles('Dockerfile', 'Makefile', 'sys/Cargo.toml') }}
          restore-keys: buildx-linux-aarch64-

      # Native ARM64 runner: use the standard Dockerfile (same as x86_64 glibc)
      - name: Build JavaScriptCore
        run: |
          mkdir -p .libs-arm
          CACHE_ARGS=()
          if [ "${{ github.event.inputs.skip_cache }}" != "true" ]; then
            CACHE_ARGS+=(--cache-from type=local,src=/tmp/.buildx-cache-linux-aarch64)
            CACHE_ARGS+=(--cache-to type=local,dest=/tmp/.buildx-cache-linux-aarch64-new,mode=max)
          fi
          docker buildx build \
            --output type=local,dest=./.libs-arm \
            "${CACHE_ARGS[@]}" \
            -f Dockerfile .

      - name: Rotate cache
        if: always() && github.event.inputs.skip_cache != 'true'
        run: |
          rm -rf /tmp/.buildx-cache-linux-aarch64
          mv /tmp/.buildx-cache-linux-aarch64-new /tmp/.buildx-cache-linux-aarch64 2>/dev/null || true

      - name: Archive static libraries
        run: |
          python3 scripts/package_jsc_archive.py --lib-dir .libs-arm --target-triple aarch64-unknown-linux-gnu --output-dir . --repo-root "$PWD" --webkit-dir WebKit

      - name: Verify archive contents
        run: |
          tar -tzf libjsc-aarch64-unknown-linux-gnu.a.gz | tee archive-contents.txt
          grep -x 'libJavaScriptCore.a' archive-contents.txt >/dev/null
          grep -x 'libWTF.a' archive-contents.txt >/dev/null
          grep -x 'libbmalloc.a' archive-contents.txt >/dev/null
          grep -x 'libstdc++.a' archive-contents.txt >/dev/null
          grep -x 'libicui18n.a' archive-contents.txt >/dev/null
          grep -x 'libicuuc.a' archive-contents.txt >/dev/null
          grep -x 'libicudata.a' archive-contents.txt >/dev/null
          grep -x 'libatomic.a' archive-contents.txt >/dev/null
          if grep -x 'libJavaScriptCoreJIT.a' archive-contents.txt >/dev/null; then
            echo "Found separate JavaScriptCoreJIT archive"
          else
            echo "No separate JavaScriptCoreJIT archive produced for this target"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libjsc-aarch64-unknown-linux-gnu
          if-no-files-found: error
          path: |
            libjsc-aarch64-unknown-linux-gnu.a.gz
            libjsc-aarch64-unknown-linux-gnu.a.gz.sha256
            libjsc-aarch64-unknown-linux-gnu.metadata.json
          retention-days: 7

  build-linux-aarch64-musl:
    name: Linux aarch64 (musl)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune --all --force
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Cache Docker layers
        if: github.event.inputs.skip_cache != 'true'
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-linux-musl-aarch64
          key: buildx-linux-musl-aarch64-${{ hashFiles('Dockerfile.musl', 'Makefile', 'sys/Cargo.toml') }}
          restore-keys: buildx-linux-musl-aarch64-

      # Native ARM64 runner: use Dockerfile.musl directly (no QEMU)
      - name: Build JavaScriptCore
        run: |
          mkdir -p .libs-arm-musl
          CACHE_ARGS=()
          if [ "${{ github.event.inputs.skip_cache }}" != "true" ]; then
            CACHE_ARGS+=(--cache-from type=local,src=/tmp/.buildx-cache-linux-musl-aarch64)
            CACHE_ARGS+=(--cache-to type=local,dest=/tmp/.buildx-cache-linux-musl-aarch64-new,mode=max)
          fi
          docker buildx build \
            --output type=local,dest=./.libs-arm-musl \
            "${CACHE_ARGS[@]}" \
            -f Dockerfile.musl .

      - name: Rotate cache
        if: always() && github.event.inputs.skip_cache != 'true'
        run: |
          rm -rf /tmp/.buildx-cache-linux-musl-aarch64
          mv /tmp/.buildx-cache-linux-musl-aarch64-new /tmp/.buildx-cache-linux-musl-aarch64 2>/dev/null || true

      - name: Archive static libraries
        run: |
          python3 scripts/package_jsc_archive.py --lib-dir .libs-arm-musl --target-triple aarch64-unknown-linux-musl --output-dir . --repo-root "$PWD" --webkit-dir WebKit

      - name: Verify archive contents
        run: |
          tar -tzf libjsc-aarch64-unknown-linux-musl.a.gz | tee archive-contents.txt
          grep -x 'libJavaScriptCore.a' archive-contents.txt >/dev/null
          grep -x 'libWTF.a' archive-contents.txt >/dev/null
          grep -x 'libbmalloc.a' archive-contents.txt >/dev/null
          grep -x 'libstdc++.a' archive-contents.txt >/dev/null
          grep -x 'libicui18n.a' archive-contents.txt >/dev/null
          grep -x 'libicuuc.a' archive-contents.txt >/dev/null
          grep -x 'libicudata.a' archive-contents.txt >/dev/null
          grep -x 'libatomic.a' archive-contents.txt >/dev/null
          if grep -x 'libJavaScriptCoreJIT.a' archive-contents.txt >/dev/null; then
            echo "Found separate JavaScriptCoreJIT archive"
          else
            echo "No separate JavaScriptCoreJIT archive produced for this target"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libjsc-aarch64-unknown-linux-musl
          if-no-files-found: error
          path: |
            libjsc-aarch64-unknown-linux-musl.a.gz
            libjsc-aarch64-unknown-linux-musl.a.gz.sha256
            libjsc-aarch64-unknown-linux-musl.metadata.json
          retention-days: 7

  # ===========================================================================
  # Tests
  # ===========================================================================

  test:
    name: Tests
    runs-on: macos-15
    needs: [build-macos-aarch64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS aarch64 artifact
        uses: actions/download-artifact@v4
        with:
          name: libjsc-aarch64-apple-darwin
          path: .

      - name: Extract static libraries
        run: |
          shasum -a 256 -c libjsc-aarch64-apple-darwin.a.gz.sha256
          mkdir -p .jsc-libs
          tar -xzf libjsc-aarch64-apple-darwin.a.gz -C .jsc-libs
          ls -la .jsc-libs/

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-test-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: rust-test-${{ runner.os }}-

      - name: Run tests
        env:
          RUST_JSC_BUILD_MODE: download
          RUST_JSC_LIB_DIR: ${{ github.workspace }}/.jsc-libs
          RUST_BACKTRACE: 1
        run: cargo test --lib -- --test-threads=1

  # ===========================================================================
  # Release
  # ===========================================================================

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-macos-x86_64
      - build-macos-aarch64
      - build-linux-x86_64
      - build-linux-aarch64
      - build-linux-x86_64-musl
      - build-linux-aarch64-musl
      - test
    if: github.ref_type == 'tag' || github.event.inputs.publish_release == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          set -euo pipefail
          ARCHIVES=(
            libjsc-x86_64-apple-darwin.a.gz
            libjsc-aarch64-apple-darwin.a.gz
            libjsc-x86_64-unknown-linux-gnu.a.gz
            libjsc-aarch64-unknown-linux-gnu.a.gz
            libjsc-x86_64-unknown-linux-musl.a.gz
            libjsc-aarch64-unknown-linux-musl.a.gz
          )

          mkdir -p release-files
          find artifacts -name '*.a.gz' -exec cp {} release-files/ \;
          find artifacts -name '*.a.gz.sha256' -exec cp {} release-files/ \;
          find artifacts -name '*.metadata.json' -exec cp {} release-files/ \;

          for archive in "${ARCHIVES[@]}"; do
            sidecar="${archive}.sha256"
            metadata="${archive%.a.gz}.metadata.json"
            for file in "$archive" "$sidecar" "$metadata"; do
              if [ ! -f "release-files/$file" ]; then
                echo "Missing release file: $file" >&2
                exit 1
              fi
            done
          done

          (
            cd release-files
            : > SHA256SUMS
            for sidecar in $(printf '%s.sha256\n' "${ARCHIVES[@]}" | sort); do
              cat "$sidecar" >> SHA256SUMS
            done
            sha256sum -c SHA256SUMS
            for archive in "${ARCHIVES[@]}"; do
              if ! awk -v archive="$archive" '$2 == archive { found=1 } END { exit found ? 0 : 1 }' SHA256SUMS; then
                echo "SHA256SUMS is missing an exact entry for ${archive}" >&2
                exit 1
              fi
            done
          )

          echo "📦 Release files:"
          ls -lh release-files/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.prepare.outputs.release_tag }}"

          echo "Release tag: $TAG"

          # Create new release with all platform archives
          # Fails if the tag already exists, forcing a version bump
          gh release create "$TAG" \
            --title "Rust-JSC-Sys $TAG" \
            --generate-notes \
            release-files/*

          echo "Release $TAG created successfully"
