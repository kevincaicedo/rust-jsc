[package]
name = "rust_jsc_macros"
description = "Macros for rust_jsc"
version = "1.0.0"
keywords = [ "javascriptcore", "javascript" ]
authors = [ "Kevin Caicedo <ing.sys.kevincaicedo@gmail.com>" ]
repository = "https://github.com/kevincaicedo/rust-jsc"
edition = "2021"
license = "MIT"
readme = "README.md"

[lib]
proc-macro = true

[dependencies]
quote = "1.0.36"
proc-macro2 = "1.0.93"
syn = { version = "2.0.63", features = ["full"] }
